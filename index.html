/* Blush-paper question surfaces; richer sky accents, without neon or glass effects. */

/* Interaction layer: purposeful tactile feedback, no decorative perpetual motion. */
:root{--tap-ease:cubic-bezier(.2,.8,.2,1);--exit-ease:cubic-bezier(.4,0,1,1)}
.answer--interactive{position:relative;overflow:hidden;transition:background-color 180ms ease,border-color 180ms ease,box-shadow 180ms var(--tap-ease),transform 180ms var(--tap-ease)}
.answer--interactive:active{transform:scale(.985)}
.answer--interactive.selected{transform:translateX(5px) rotate(-.4deg);box-shadow:5px 5px 0 var(--ink)}
.answerMark{margin-left:auto;font-size:22px;opacity:.27;transform:rotate(-35deg);transition:transform 200ms var(--tap-ease),opacity 200ms var(--tap-ease)}
.answer--interactive.selected .answerMark{transform:rotate(0);opacity:1}
.decisionRow{display:flex;align-items:center;justify-content:space-between;gap:17px;margin-top:24px;flex-wrap:wrap}
.decisionRow .primary{margin:0}
.decisionNote{font-size:13px;line-height:1.5;font-weight:700;color:#805b69;max-width:250px}
.primary.ready{background:#d85071;color:#fff}
.primary:active:not(:disabled){transform:translateY(1px) scale(.97);box-shadow:0 2px 0 #e8c4cb}
#questionScreen.leaving{animation:quizExit 240ms var(--exit-ease) both;pointer-events:none}
@keyframes quizExit{to{opacity:0;transform:translateY(-13px) scale(.985)}}
.mascotPeek{animation:mascotPeek 340ms var(--tap-ease) both!important}
@keyframes mascotPeek{50%{transform:translateY(-12px) rotate(7deg)}}
.chapterName{transition:transform .25s var(--tap-ease)}
.quiz.enter .chapterName{animation:chapterTag 450ms var(--tap-ease) both}
@keyframes chapterTag{from{transform:rotate(-5deg) translateY(-7px);opacity:0}to{transform:rotate(0);opacity:1}}
.quiz.enter .answer--interactive{animation:answerRise 320ms var(--tap-ease) both}
.quiz.enter .answer--interactive:nth-child(2){animation-delay:65ms}
@keyframes answerRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:720px){.decisionRow{align-items:stretch}.decisionRow .primary{width:100%}.decisionNote{max-width:none}}
@media(prefers-reduced-motion:reduce){.answer--interactive,.answerMark,.primary,.chapterName{transition:none!important}#questionScreen.leaving,.mascotPeek,.quiz.enter .answer--interactive,.quiz.enter .chapterName{animation:none!important}}

ry" id="scrollLeaderboard">🏆 View rankings</button></div><p id="shareStatus" class="toast" aria-live="polite"></p><div class="v3EndLabel">03 · THE ANSWER VAULT</div><section class="v3Secret"><div class="v3Seal">✉</div><div class="v3SecretText"><span class="v3Kicker">SEALED UNTIL YOU ARE READY</span><h3>Wait… wanna know what you got wrong?</h3><p>Twenty little secrets. Your answers are tucked away here — open only when you want the full reveal.</p></div><button class="vaultReveal" id="revealAnswers" aria-expanded="false" aria-controls="answerVault">Open the answer vault <span>↗</span></button><div id="answerVault" hidden><div class="reviewActions" role="group" aria-label="Filter answer review"><button class="reviewFilter active" data-filter="wrong">Missed ('+mistakes+')</button><button class="reviewFilter" data-filter="all">All 20</button><button class="reviewFilter" data-filter="correct">Got right ('+score+')</button></div><div id="reviewEntries"></div><p class="minor" id="reviewEmpty" hidden>No answers here ♡</p></div></section></section>';
 function filterReview(filter){let shown=0;document.querySelectorAll('.reviewCard').forEach(card=>{let ok=filter==='all'||card.dataset.outcome===filter;card.hidden=!ok;if(ok)shown++});document.getElementById('reviewEmpty').hidden=shown>0;document.querySelectorAll('.reviewFilter').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))})}

function renderEditor(){editorQuestions=clone(questions);app.innerHTML='<section class="editor enter"><div class="eyebrow">Creator studio / only local on this device</div><h1 class="serif" style="font-size:clamp(52px,8vw,83px);line-height:1;margin:20px 0">Make it<br><span style="color:var(--orange)">personal.</span></h1><p class="lead">These are starter questions, not claims about your private memories. Replace them with what only your friends know. Changes here are saved on this device, <strong>not automatically published</strong> to GitHub Pages.</p><div id="fields"></div><div class="editorTools"><button class="secondary" id="add">+ Add a question</button><button class="primary" id="save">Save on this device</button><button class="secondary" id="export">Export questions JSON ↓</button><button class="secondary" id="reset">Reset to demo</button></div><p class="toast" id="editorStatus" role="status"></p><p class="minor">To publish customized questions for the Friends edition, update the STARTER array in index.html and push to main. Keep the answers private until she plays.</p></section>';drawEditor();document.getElementById('add').onclick=()=>{readEditor();editorQuestions.push({q:'Your new question?',o:['Option A','Option B'],a:0});drawEditor()};document.getElementById('save').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Please fill every question and both options.';return}questions=clone(editorQuestions);try{localStorage.setItem('maalkinQuestionsV2',JSON.stringify(questions));document.getElementById('editorStatus').textContent='Saved on this device. Not published for Friends yet.'}catch(e){document.getElementById('editorStatus').textContent='Browser storage unavailable — use Export JSON.'}};document.getElementById('export').onclick=()=>{readEditor();if(!editorQuestions.every(valid)){document.getElementById('editorStatus').textContent='Complete all questions before exporting.';return}const blob=new Blob([JSON.stringify(editorQuestions,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maalkin-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('reset').onclick=()=>{if(!confirm('Replace your local draft with starter questions?'))return;questions=clone(STARTER);localStorage.removeItem('maalkinQuestionsV2');renderEditor()}}
function drawEditor(){document.getElementById('fields').innerHTML=editorQuestions.map((q,j)=>'<div class="editCard" data-j="'+j+'"><div class="eyebrow">Question '+(j+1)+'</div><label>THE QUESTION</label><input class="field editq" value="'+esc(q.q)+'">'+q.o.map((o,k)=>'<label>OPTION '+String.fromCharCode(65+k)+'</label><input class="field edito" value="'+esc(o)+'">').join('')+'<label>CORRECT ANSWER</label><select class="field edita">'+[0,1].map(k=>'<option value="'+k+'" '+(q.a===k?'selected':'')+'>'+String.fromCharCode(65+k)+'</option>').join('')+'</select><button class="link remove" data-j="'+j+'" style="margin-top:12px">Remove question</button></div>').join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{readEditor();if(editorQuestions.length<=1)return;editorQuestions.splice(Number(b.dataset.j),1);drawEditor()})}
function readEditor(){editorQuestions=[...document.querySelectorAll('.editCard')].map(e=>({q:e.querySelector('.editq').value,o:[...e.querySelectorAll('.edito')].map(x=>x.value),a:Number(e.querySelector('.edita').value)}))}
